[package]
name = "mcpgw"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "One binary that manages your MCP servers across every client and gateways their traffic"

[dependencies]
mcpgw-core = { version = "0.5.0", path = "../core" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
owo-colors.workspace = true
which.workspace = true
tokio.workspace = true
tempfile.workspace = true
ureq.workspace = true
self-replace.workspace = true
sha2.workspace = true
flate2.workspace = true
tar.workspace = true
ratatui.workspace = true
crossterm.workspace = true

[target.'cfg(windows)'.dependencies]
zip.workspace = true

[dev-dependencies]
insta.workspace = true
assert_cmd.workspace = true
rmcp.workspace = true
# The OAuth end-to-end test drives the same in-process authorization server
# the core suite uses, rather than a second copy of one that could disagree
# with it.
mcpgw-test-server = { path = "../test-server" }
mcpgw-core = { version = "0.5.0", path = "../core" }
tokio.workspace = true
tempfile.workspace = true
# The self-update end-to-end test builds the release archive it then serves,
# so it needs the same writers the command reads with. Already in the tree,
# so this costs no extra resolution.
flate2.workspace = true
tar.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dev-dependencies]
zip.workspace = true

# `mcpgw eject` only asks its confirmation question when stdin is a
# terminal, so the tests about what it holds while that question waits have
# to open one.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
