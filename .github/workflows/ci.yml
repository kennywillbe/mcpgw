name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR branch that gets pushed (or "update branch"-ed) twice in a row should
# only spend minutes on the newest commit. Main is exempt from the cancel: it
# is the only place the cross-OS matrix runs, so its result is a signal we
# actually need, not a preview.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Linux on every PR; the full matrix only once the change is on main.
    # Cross-OS breakage therefore surfaces at merge instead of review time —
    # affordable while merges here are sequential and a red main is fixed on
    # the spot.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # --locked everywhere: an off-lock re-resolution has already broken
      # this build once, when a patch-level bump under toml/serde_json moved
      # the boxed error layouts in crates/core/src/error.rs. release.yml
      # pins the same way.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
