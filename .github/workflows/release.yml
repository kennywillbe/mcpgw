name: Release

# Triggered by a `v*` tag — in practice the one release-please pushes when its
# PR merges, though a hand-pushed tag works too. This builds one archive per
# target, hashes it, and attaches everything to the GitHub Release, creating
# that release only if release-please has not already. Deliberately
# hand-rolled instead of generated: four targets and a `gh` invocation are
# easier to read than a generator's output.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p mcpgw --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="mcpgw-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/mcpgw" "dist/${name}/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $name = "mcpgw-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mcpgw.exe" "dist/$name/"
          Copy-Item README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          cp install.sh dist/mcpgw-installer.sh
          # One combined file so `sha256sum -c` can verify the whole release.
          (cd dist && sha256sum mcpgw-* > SHA256SUMS && rm -f *.sha256)
          ls -l dist

      # Creating the release is conditional because release-please usually
      # got there first: it pushes the tag *and* publishes a release with its
      # generated notes, and this workflow then triggers on that same tag. An
      # unconditional `gh release create` fails with "a release with the same
      # tag name already exists" and the archives never get attached — which
      # is exactly what happened to v0.1.0. Uploading is unconditional and
      # clobbers, so a re-run replaces the assets instead of failing on them.
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            notes="$(mktemp)"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md) for what changed.\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > "$notes"
            # The `||` closes the window between the check and the create:
            # a release that appeared in between is fine, anything else is
            # still a failure.
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --verify-tag \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber dist/*

  # No `needs`: the library and the CLI source go to crates.io straight from
  # the tag, and nothing about that depends on the archives the build matrix
  # produces. Making it wait would leave crates.io minutes behind the release
  # for no gain — and leave it unpublished entirely if one target fails.
  crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fails before anything is checked out, with a message that says what to
      # do, rather than letting cargo fail at the end of a build with "no
      # token found".
      - name: Check the registry token is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set. Create a crates.io API token (https://crates.io/settings/tokens) with the publish-update scope, scoped to the mcpgw and mcpgw-core crates, then add it to this repository as the CARGO_REGISTRY_TOKEN secret (Settings > Secrets and variables > Actions)." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: crates-io

      # The token reaches cargo only through this env var — it is never passed
      # on a command line, so it cannot end up in a log line.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/scripts/publish-crates.sh "$GITHUB_REF_NAME"

  # The tap used to be bumped by hand after every release, which meant it was
  # briefly — sometimes lastingly — pointing at the previous version's
  # tarballs. This job needs `release` so it only ever reads a SHA256SUMS that
  # is already attached to the release.
  homebrew:
    name: Bump Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fails before anything is checked out, with a message that says what to
      # do, rather than letting the tap checkout fail with a bare 404.
      - name: Check the tap token is configured
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set. Create a fine-grained PAT with Contents: read and write on kennywillbe/homebrew-tap only, then add it to this repository as the HOMEBREW_TAP_TOKEN secret (Settings > Secrets and variables > Actions)." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: kennywillbe/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Fetch SHA256SUMS from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir . --clobber

      - name: Rewrite the formula
        run: |
          set -euo pipefail
          .github/scripts/bump-homebrew-formula.sh \
            "$GITHUB_REF_NAME" SHA256SUMS tap/Formula/mcpgw.rb

      # Idempotent on purpose: re-running the release workflow for a tag whose
      # formula is already correct should be a no-op, not an empty commit.
      - name: Commit and push
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/mcpgw.rb; then
            echo "Formula is already at ${GITHUB_REF_NAME}; nothing to push."
            exit 0
          fi
          git config user.name kennywillbe
          git config user.email emresimsek2013@gmail.com
          git add Formula/mcpgw.rb
          git commit -m "mcpgw ${GITHUB_REF_NAME#v}"
          git push
