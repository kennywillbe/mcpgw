name: Docs

# Publishes book/ to https://kennywillbe.github.io/mcpgw/.
# Requires Settings → Pages → Source: "GitHub Actions" (one-time).

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a merge train
# still ends on the newest book.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned rather than "latest": docs should not start failing because
      # mdBook shipped a breaking config change.
      MDBOOK_VERSION: 0.4.52
    steps:
      - uses: actions/checkout@v7

      # The release tarball is a single static binary — seconds, versus a
      # `cargo install` build even with a warm cache.
      - name: Install mdBook
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/configure-pages@v6

      - run: mdbook build book

      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
