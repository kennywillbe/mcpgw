[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/test-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Manage MCP servers across every client from one place"

[workspace.dependencies]
mcpgw-core = { version = "0.1.0", path = "crates/core" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.23"
fs4 = "0.13"
tempfile = "3"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
which = "8"
rmcp = { version = "3", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "macros"] }
owo-colors = "4"
insta = "1"
assert_cmd = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
