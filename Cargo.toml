[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/test-server"]

[workspace.package]
# Versions are literal per-crate rather than inherited: release-please's cargo
# updater rewrites `[package] version` in each manifest and cannot follow
# workspace inheritance.
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Manage MCP servers across every client from one place"
repository = "https://github.com/kennywillbe/mcpgw"
homepage = "https://github.com/kennywillbe/mcpgw"
readme = "README.md"
keywords = ["mcp", "gateway", "cli", "ai", "llm"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
toml_edit = "0.25"
tempfile = "3"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# The JSONC clients (VS Code-family settings files) are hand-edited, so a
# sync that dropped their comments would be vandalism. `cst` is the only
# maintained Rust JSONC reader that also *edits*: it keeps a concrete syntax
# tree, so an entry can be replaced with every comment, quote style and
# indent around it left where it was. The alternatives all lose that —
# json5/json_comments/serde-jsonc parse to a value and cannot write back,
# and a full formatter (biome, dprint) would reformat the whole file.
jsonc-parser = { version = "0.33", features = ["cst", "serde_json"] }
url = "2"
which = "8"
rmcp = { version = "3", features = [
    "client",
    "transport-child-process",
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
    # `transport-streamable-http-client-reqwest` pulls reqwest in, but rmcp
    # declares it with default-features = false, so without this feature the
    # client is compiled with no TLS backend at all and every https upstream
    # fails at the connection level ("error sending request ... when send
    # initialize request"). Found by dogfooding: the suite only ever dialed
    # http://127.0.0.1, so nothing caught it. `reqwest` maps to
    # reqwest/rustls — rustls keeps the single-static-binary story, and its
    # platform verifier trusts the OS store, so corporate and proxy roots
    # work without shipping our own CA bundle. crates/core/tests/tls.rs is
    # the guard that stops this line being deleted again.
    "reqwest",
    # The OAuth broker behind `mcpgw auth login`. It carries the whole of the
    # 2026-07-28 client-registration ladder — pre-registered ids, Client ID
    # Metadata Documents, DCR — plus PKCE S256, `iss` validation and the
    # `CredentialStore` hook the gateway refreshes through, and mcpgw would
    # otherwise be writing a second OAuth client beside the one the SDK
    # already ships. It pulls `oauth2` and `reqwest`; the `reqwest` feature
    # above still decides the TLS backend, so the single-static-binary
    # story (rustls, no native TLS) is unchanged.
    "auth",
] }
# `reqwest` is spelled out here as well as on the entry above rather than
# left to cargo unifying the two: this alias is what the test-server crate
# builds against, and a graph that resolved it on its own would hand the
# tests a client with no TLS backend while the shipped binary had one.
rmcp-client-http = { package = "rmcp", version = "3", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
# Dev-only, and deliberately declared with no TLS features of its own: what
# it sees is exactly what cargo unified from the `rmcp` entry above, so the
# guard in crates/core/tests/tls.rs stops compiling the moment that entry
# loses `reqwest`. Naming a TLS feature here would defeat the whole point.
reqwest = { version = "0.13", default-features = false }
# The token types rmcp's `auth` feature stores and refreshes. Declared here
# only so the credential file can be given an explicit, documented shape
# instead of an opaque blob: the file is read back into the same
# `StandardTokenResponse` rmcp hands the transport. Same version rmcp
# resolves, and default features off for the same reason rmcp declares it
# that way — no second TLS backend.
oauth2 = { version = "5", default-features = false }
# `CredentialStore` is an `#[async_trait]` trait, so implementing it needs
# the same attribute macro rmcp declared it with.
async-trait = "0.1"
axum = "0.8"
# The per-server endpoint table is read on every request and replaced whole
# when the config reloads. `ArcSwap` is the read-mostly shape for exactly
# that: the load on the hot path is lock-free, so a reload can never make a
# request queue behind a writer — which an `RwLock` around the same map would.
arc-swap = "1.9"
# axum gives us a router but not tower's `Service` trait, and dispatching to a
# pre-built rmcp service means driving one by hand.
tower-service = "0.3"
http = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "process",
    "time",
    "macros",
    "signal",
    "net",
    # Named rather than inherited from what rmcp/axum happen to enable:
    # `sync` carries Mutex/Notify in the upstream manager, `io-util` the
    # raw-socket helpers in the gateway tests.
    "sync",
    "io-util",
] }
owo-colors = "4"
# `self-update` needs a blocking HTTP client for two GETs against
# github.com. rmcp pulls reqwest in, but that is rmcp's own dependency and
# reaching into it would mean declaring reqwest here as well *and* driving a
# tokio runtime for a plain download. ureq is blocking, small, and its
# default TLS is rustls — the same backend the rmcp comment above argues
# for. Left on default features: that is rustls with the bundled webpki
# roots, which is all github.com needs, and it skips the extra
# platform-verifier dependency.
ureq = "3"
# Replacing the running executable is a platform minefield (Windows refuses
# to unlink a mapped image; a plain rename across filesystems fails). This
# crate is the one small, focused answer — the popular `self_update` crate
# does the same job but drags in its own HTTP client, archive readers and
# release-host abstractions.
self-replace = "1"
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
# Only the Windows release ships a zip; every other target gets a tarball,
# so the zip reader is target-gated in crates/cli/Cargo.toml rather than
# compiled into every build.
zip = { version = "8", default-features = false, features = ["deflate"] }
# `watch --tui` draws a live table, a call log and a detail pane, and
# redrawing those by hand out of ANSI escapes is how a terminal ends up
# wedged. ratatui is pure Rust, so the single static binary stays one; the
# backend split in 0.30 means the default feature set is trimmed to what is
# actually drawn — no calendar widget, no `macros`, no `underline-color`,
# just the crossterm backend and the widgets the three panes use.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# The other half of the same dependency: raw mode, the alternate screen and
# the key events the TUI loop reads. Named here rather than reached for
# through ratatui's re-export because the loop drives it directly, and pinned
# to the 0.29 line ratatui 0.30's backend links against — the graph has to
# carry one crossterm and not two, or the terminal ratatui restores would not
# be the one this loop put into raw mode. Left on default features on
# purpose: ratatui-crossterm already depends on it with defaults, so trimming
# them here would buy nothing cargo's feature unification does not put back,
# and would only make the manifest lie about what is compiled.
crossterm = "0.29"
insta = "1"
assert_cmd = "2"
# Traffic capture redacts before it writes, and `[capture] redact` lets a
# user add patterns of their own — user-supplied regexes need a real engine,
# and the built-in credential shapes are the same kind of match. Default
# features are off: only the ASCII matcher, the literal accelerators the
# per-request hot path wants, and the two Unicode tables the patterns
# actually use (`(?i)` case folding and `\s`/`\b`).
regex = { version = "1", default-features = false, features = [
    "std",
    "perf",
    "unicode-case",
    "unicode-perl",
] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
